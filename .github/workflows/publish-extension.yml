name: Publish extension

# Publish by pushing a tag that matches the version in vscode-extension/package.json:
#   git tag ext-v0.2.0 && git push origin ext-v0.2.0
# Needs the repository secret VSCE_PAT (Azure DevOps token with Marketplace > Manage scope).

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Check the release is publishable
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "ext-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          url=$(node -p "require('./package.json').contributes.configuration.properties['jitRisk.apiUrl'].default")
          case "$url" in https://*) ;; *) echo "Default jitRisk.apiUrl must be the public https API, got $url"; exit 1;; esac

      - run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
